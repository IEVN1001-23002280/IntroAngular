<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <form>
                    <div class="form-group pt-4">
                        <label for="num1">Numero 1:</label>
                        <input [(ngModel)]="num1" name="num1" type="text" class="form-control"
                        id="num1" placeholder="Ingresa Nuemro 1"/>
                    </div>
                    <div class="form-group pt-4">
                        <label for="num2">Numero 2:</label>
                        <input [(ngModel)]="num2" name="num2" type="text" class="form-control"
                        id="num2" placeholder="Ingresa Numero 2"/>
                    </div>
                    <br/>
                    <div class="form-check mt-3">
                        <input class="form-check-input" type="radio" name="operacion" id="sumar" value="sumar" [(ngModel)]="operacion">
                        <label class="form-check-label" for="sumar">Sumar</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" id="restar" value="restar" [(ngModel)]="operacion">
                        <label class="form-check-label" for="restar">Restar</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" id="multiplicar" value="multiplicar" [(ngModel)]="operacion">
                        <label class="form-check-label" for="multiplicar">Multiplicar</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" id="dividir" value="dividir" [(ngModel)]="operacion">
                        <label class="form-check-label" for="dividir">Dividir</label>
                    </div>

                    <br/>

                    <button (click)="calcular()" type="button" class="btn btn-primary">
                        Calcular
                    </button>
                    
                </form>
            </div>

            <h2>Resultado: {{resultado}}</h2>


            <div class="col-6">
                
            </div>
            
            

        </div>

        


    </div>
</body>
</html>
