<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areas</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <form>
                    
                    <div class="form-group pt-4">
                        <label for="base">Base:</label>
                        <input [(ngModel)]="base" name="base" type="text" class="form-control"
                        id="base" placeholder="Ingresa Base"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="altura">Altura:</label>
                        <input [(ngModel)]="altura" name="altura" type="text" class="form-control"
                        id="altura" placeholder="Ingresa Altura"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="radio">Radio:</label>
                        <input [(ngModel)]="radio" name="radio" type="text" class="form-control"
                        id="radio" placeholder="Ingresa Radio"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="perimetro">Perimetro:</label>
                        <input [(ngModel)]="perimetro" name="perimetro" type="text" class="form-control"
                        id="perimetro" placeholder="Ingresa Perimetro"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="apotema">Apotema:</label>
                        <input [(ngModel)]="apotema" name="apotema" type="text" class="form-control"
                        id="apotema" placeholder="Ingresa Apotema"/>
                    </div>

                    <br/>

                    <div class="form-check mt-3">
                        <input class="form-check-input" type="radio" name="operacion" id="triangulo" value="triangulo" [(ngModel)]="operacion">
                        <label class="form-check-label" for="triangulo">Triangulo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" id="circulo" value="circulo" [(ngModel)]="operacion">
                        <label class="form-check-label" for="circulo">Circulo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" id="rectangulo" value="rectangulo" [(ngModel)]="operacion">
                        <label class="form-check-label" for="rectangulo">Rectangulo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" id="pentagono" value="pentagono" [(ngModel)]="operacion">
                        <label class="form-check-label" for="pentagono">Pentagono</label>
                    </div>

                    <br/>

                    <button (click)="calcular()" type="button" class="btn btn-primary">
                        Calcular
                    </button>
                    
                </form>
            </div>

            <h2>Resultado: {{resultado}}</h2>

            <div class="col-6">
                
            </div>
            
        </div>
    </div>
</body>
</html>
