<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <form>
                    <div class="form-group pt-4">
                        <label for="usuario">Usuario:</label>
                        <input [(ngModel)]="usuario" name="usuario" type="text" class="form-control"
                        id="usuario" placeholder="Ingresa usuario"/>
                    </div>

                    <div class="form-group pt-4">
                        <label for="contra">Contraseña:</label>
                        <input [(ngModel)]="contra" name="contra" type="password" class="form-control"
                        id="contra" placeholder="Ingresa contraseña"/>
                    </div>

                    <br/>

                    <button (click)="validar()" type="button" class="btn btn-primary">
                        Ingresar
                    </button>
                </form>
            </div>

            <h2>{{mensaje}}</h2>

        </div>
    </div>
</body>
</html>
